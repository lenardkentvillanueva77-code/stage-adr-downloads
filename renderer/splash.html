<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Post ADR Pro Beta 1.0</title>
  <style>
    * { box-sizing: border-box; }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #0b0b0b;
      color: #ececec;
      font-family: "Segoe UI", Arial, sans-serif;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      background:
        radial-gradient(circle at top, rgba(150, 24, 24, 0.24), transparent 46%),
        linear-gradient(180deg, #111111 0%, #0a0a0a 100%);
    }

    .splash-shell {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 28px;
    }

    .splash-card {
      width: 100%;
      max-width: 560px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      background: rgba(18, 18, 18, 0.96);
      box-shadow: 0 18px 60px rgba(0, 0, 0, 0.48);
      border-radius: 14px;
      padding: 34px 38px 28px;
      text-align: center;
    }

    .logo-wrap {
      display: flex;
      justify-content: center;
      margin-bottom: 18px;
    }

    .logo-wrap img {
      width: 72px;
      height: 72px;
      object-fit: contain;
      filter: drop-shadow(0 6px 16px rgba(0, 0, 0, 0.36));
    }

    .eyebrow {
      margin: 0 0 8px;
      color: #8f8f8f;
      font-size: 11px;
      letter-spacing: 0.22em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: 38px;
      line-height: 1.05;
      font-weight: 700;
      letter-spacing: 0.02em;
    }

    .post {
      color: #d12a2a;
    }

    .version {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-top: 16px;
      min-width: 132px;
      height: 34px;
      padding: 0 14px;
      border-radius: 999px;
      border: 1px solid rgba(209, 42, 42, 0.5);
      background: rgba(209, 42, 42, 0.12);
      color: #f3dada;
      font-size: 14px;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .subtitle {
      margin: 18px 0 0;
      color: #9b9b9b;
      font-size: 13px;
      letter-spacing: 0.04em;
    }

    .loading-line {
      margin: 24px auto 0;
      width: 220px;
      height: 3px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.08);
      overflow: hidden;
      position: relative;
    }

    .loading-line::after {
      content: "";
      position: absolute;
      inset: 0 auto 0 0;
      width: 38%;
      background: linear-gradient(90deg, rgba(209, 42, 42, 0.2), #d12a2a);
      animation: sweep 1.2s ease-in-out infinite;
    }

    @keyframes sweep {
      0% { transform: translateX(-110%); }
      100% { transform: translateX(320%); }
    }
  </style>
</head>
<body>
  <main class="splash-shell">
    <section class="splash-card" aria-label="Post ADR Pro splash screen">
      <div class="logo-wrap">
        <img src="./assets/stagepost-logo.png" alt="Post ADR Pro logo">
      </div>
      <p class="eyebrow">Stage Post</p>
      <h1>Post <span class="post">ADR Pro</span></h1>
      <div class="version">Beta 1.0</div>
      <p class="subtitle">Professional ADR cueing and recording</p>
      <div class="loading-line" aria-hidden="true"></div>
    </section>
  </main>
</body>
</html>
